<!DOCTYPE html>
<!--
  GABARIT DU MÉMOIRE TECHNIQUE (HTML intermédiaire, commun à Mac et Windows).
  Voir references/memoire-technique.md. À copier dans un dossier temporaire, puis à remplir :
  chaque commentaire HTML du gabarit est une consigne à remplacer, pas du contenu. Ne laissez aucun commentaire dans le résultat.

  Sous-ensemble HTML autorisé (ne rien utiliser d'autre, pour que la conversion reste fiable) :
    h1, h2, h3, p, ul, li, strong, em, br
    et le passage à compléter : <span class="a-completer" style="…">[À COMPLÉTER : …]</span> (modèle ci-dessous)
  Pas de tableau : textutil les écrase en simples paragraphes dans le .docx (vérifié). Utilisez des listes à puces.
  Pas d'image, pas de lien, pas de script, pas de CSS externe. Le style est en ligne ou dans la balise style.
  Les tailles sont en px : textutil les lit comme des points (11px donne du 11 points dans Word).
-->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mémoire technique</title>
<style>
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11px; }
  h1 { font-size: 20px; }
  h2 { font-size: 15px; }
  h3 { font-size: 12px; }
</style>
</head>
<body>

<h1>Mémoire technique</h1>
<p><strong>Consultation :</strong> <!-- objet, tel qu'écrit dans le RC --></p>
<p><strong>Acheteur :</strong> <!-- acheteur --> – <strong>Lot :</strong> <!-- n° et intitulé du lot --> – <strong>Référence :</strong> <!-- référence de la consultation, si le RC en donne une --></p>
<p><strong>Entreprise :</strong> <!-- nom, commune, SIRET, téléphone, e-mail : ceux de la fiche, ou passage à compléter --></p>

<h2>Comment ce mémoire répond aux critères</h2>
<ul>
  <!-- une puce par critère et sous-critère, dans l'ordre du RC, avec leur poids ou leurs points :
       <li><strong>Valeur technique</strong> (50 %) : sections 2 et 3</li>
       Le critère « prix » y figure avec la mention « traité dans l'acte d'engagement, pas dans ce mémoire ». -->
</ul>

<h2>1. Présentation de l'entreprise</h2>
<!-- uniquement la fiche : métiers, effectif (personnes, dont apprentis), certifications avec numéro et validité.
     Une information utile ici mais absente de la fiche devient un passage à compléter. -->

<!-- UNE section h2 par critère jugé sur le mémoire, dans l'ordre et avec les mots du RC, poids inclus : -->
<h2>2. <!-- intitulé exact du critère --> (<!-- poids -->)</h2>
<h3><!-- intitulé exact du sous-critère --> (<!-- points --> points)</h3>
<p><!-- les mots de l'artisan, nettoyés mais sans rien ajouter --></p>
<p><span class="a-completer" style="background-color:#FFFF00; color:#C00000; font-weight:bold">[À COMPLÉTER : ce que l'artisan doit préciser, dit simplement]</span></p>

<h2><!-- numéro -->. Références</h2>
<ul>
  <!-- une puce par référence de la fiche, telle quelle, sans rien ajouter :
       <li>2025 – Mairie de Bron – Rénovation des sanitaires de l'école Jean-Moulin – Bron – 48 000 € HT</li> -->
</ul>

</body>
</html>
